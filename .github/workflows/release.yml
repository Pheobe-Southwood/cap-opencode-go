name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v2.0.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  PLUGIN_ID: cpa-opencodego

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cc: gcc
            apt: ""
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cc: clang
            apt: ""
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cc: clang
            apt: ""
          - goos: windows
            goarch: amd64
            runner: windows-2025
            cc: gcc
            apt: ""
            mingw: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross compiler
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Setup MSYS2 MinGW
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc zip

      - name: Add MinGW to PATH
        if: matrix.mingw
        shell: bash
        run: |
          echo "/c/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "/c/msys64/usr/bin" >> "$GITHUB_PATH"

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $tag" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing v${version}"

      - name: Build four protocol faces
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail
          scripts/build-faces.sh "${{ steps.version.outputs.version }}" dist/libs

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          scripts/package-release.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.goos }}" \
            "${{ matrix.goarch }}" \
            dist/libs \
            dist/out

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/out/*.zip
            dist/out/checksums-*.txt
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: release-*

      - name: Resolve version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          version="${tag#v}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/checksums-*.txt | tr -d '\r' | sort -k2 > dist/checksums.txt
          cat dist/checksums.txt
          test -s dist/checksums.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.zip dist/checksums.txt \
              --verify-tag \
              --title "v${VERSION}" \
              --generate-notes \
              --latest
          fi
